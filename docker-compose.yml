services:
  db:
    image: postgis/postgis:16-3.4
    container_name: sar_dss_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dss_password}
      POSTGRES_DB: ${POSTGRES_DB:-sar_dss}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./server/app/sql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./server/app/sql/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sar} -d ${POSTGRES_DB:-sar_dss}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: sar_dss_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-sar}:${POSTGRES_PASSWORD:-dss_password}@db:5432/${POSTGRES_DB:-sar_dss}
      POSTGRES_HOST: db
    ports:
      - "${APP_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - reports_data:/app/reports

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000/api/v1}
    container_name: sar_dss_frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  db_data:
  reports_data:
